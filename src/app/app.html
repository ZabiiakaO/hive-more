<svg id="hexbg" aria-hidden="true"></svg>

<div id="intro" [class.hide]="introHidden()" aria-hidden="true">
  <img class="intro-logo" src="hivemore-mark.svg" alt="" />
</div>

<div class="wrap">
  <header class="site-header" [class.reveal]="revealed()">
    <img class="logo-mark" src="hivemore-mark.svg" alt="HiveMore logo mark" />
    <div class="logo-word" aria-label="HiveMore">
      <span class="hive">Hive</span><span class="more">More</span>
    </div>
  </header>

  <main>

    <div class="tagline" [class.reveal]="revealed()">
      <span class="dash" aria-hidden="true"></span>
      <span class="text-48 text-nowrap">Coming soon</span>
      <span class="dash" aria-hidden="true"></span>
    </div>
    <div class="goldline-row" [class.reveal]="revealed()" aria-hidden="true">
      <div class="goldline"></div>
    </div>
    <h1 [class.reveal]="revealed()">The Future of <br/> <em>Hives</em> <br/> Is Coming.<br/></h1>
    <div class="goldline-row" [class.reveal]="revealed()" aria-hidden="true">
      <div class="goldline"></div>
    </div>

    <div class="tagline" [class.reveal]="revealed()">
      <span class="dash" aria-hidden="true"></span>
      <span class="eyebrow-label">Smart hives. More life.</span>
      <span class="dash" aria-hidden="true"></span>
    </div>
  </main>

  <footer [class.reveal]="revealed()">
    <span class="fine">© 2026 HiveMore. All rights reserved.</span>
  </footer>
</div>
